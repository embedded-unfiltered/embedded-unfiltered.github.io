<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to C Array Converter | Embedded Unfiltered</title>
    <meta name="description"
        content="Convert images to C arrays for embedded displays (OLED, TFT, ePaper). Supports Monochrome, RGB565, and various packing formats.">
    <link rel="stylesheet" href="../css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="keywords"
        content="image to c array, bitmap converter, OLED images, RGB565 converter, embedded graphics, logo to hex">
    <meta property="og:title" content="Image to C Array Converter | Embedded Unfiltered">
    <meta property="og:description"
        content="Convert images to C arrays for embedded displays (OLED, TFT, ePaper). Supports Monochrome, RGB565, and various packing formats.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://embedded-unfiltered.github.io/tools/image-to-c.html">
    <link rel="canonical" href="https://embedded-unfiltered.github.io/tools/image-to-c.html">
    <style>
        .converter-grid {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: var(--space-md);
            height: calc(100vh - 180px);
            min-height: 600px;
        }

        .panel {
            background: var(--color-bg-panel);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--color-border-subtle);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Input Panel Styles */
        .drop-zone {
            border: 2px dashed var(--color-border-subtle);
            border-radius: var(--radius-md);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--color-text-secondary);
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--color-accent);
            background: rgba(0, 255, 136, 0.05);
            color: var(--color-accent);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
        }

        /* Preview Panel Styles */
        .preview-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            /* Contrast for transparency */
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }

        canvas {
            image-rendering: pixelated;
            /* Essential for pixel art/low res */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            max-height: 100%;
        }

        /* Output Panel Styles */
        .code-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px;
            resize: none;
            flex: 1;
            color: var(--color-text-primary);
            white-space: pre;
            overflow: auto;
        }

        .metadata-tag {
            font-size: 0.8rem;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--color-text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .converter-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                height: auto;
            }

            .panel:nth-child(3) {
                /* Output panel */
                grid-column: 1 / -1;
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .converter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand-glitch">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="white" stroke="none" />
                <path d="M10 9L7 12L10 15M14 9L17 12L14 15" stroke="black" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            Embedded Unfiltered
        </h1>
        <a href="../index.html" class="back-link">Back to Home</a>
    </header>

    <main class="tool-content" style="max-width: 1600px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Image to C Array</h1>

        </div>

        <div class="converter-grid">
            <!-- INPUT PANEL -->
            <div class="panel">
                <div class="panel-header">Input Settings</div>
                <div class="panel-content">
                    <!-- File Upload -->
                    <div class="drop-zone" id="dropZone">
                        <p>Drop Image or Click</p>
                        <input type="file" id="fileInput" accept="image/*" style="display:none">
                    </div>

                    <div class="control-group">
                        <label class="control-label">Resize (Pixels)</label>
                        <div class="input-row">
                            <input type="number" id="inputWidth" placeholder="W" class="input-field">
                            <input type="number" id="inputHeight" placeholder="H" class="input-field">
                        </div>
                        <label class="checkbox-label" style="font-size:0.8rem;">
                            <input type="checkbox" id="keepAspect" checked> Maintain Aspect Ratio
                        </label>
                    </div>

                    <hr style="border-color:var(--color-border-subtle); width:100%;">

                    <div class="control-group">
                        <label class="control-label">Output Format</label>
                        <select id="formatSelect" class="input-field">
                            <option value="MONO_V_LSB">Monochrome (Vertical Byte, LSB)</option>
                            <option value="MONO_V_MSB">Monochrome (Vertical Byte, MSB)</option>
                            <option value="MONO_H_LSB">Monochrome (Horizontal Byte, LSB)</option>
                            <option value="MONO_H_MSB">Monochrome (Horizontal Byte, MSB)</option>
                            <option value="RGB565_BE">RGB565 (Big Endian)</option>
                            <option value="RGB565_LE">RGB565 (Little Endian)</option>
                            <!-- Grayscale Future -->
                        </select>
                    </div>

                    <div class="control-group" id="monoControls">
                        <label class="control-label">Threshold (0-255)</label>
                        <input type="range" id="thresholdRange" min="0" max="255" value="128" step="1">
                        <div
                            style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--color-text-tertiary);">
                            <span>Black</span>
                            <span id="thresholdValue">128</span>
                            <span>White</span>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="invertColors"> Invert Colors
                        </label>
                    </div>
                </div>
            </div>

            <!-- PREVIEW PANEL -->
            <div class="panel">
                <div class="panel-header">
                    Preview
                    <span id="previewDims" class="metadata-tag">0 x 0</span>
                </div>
                <div class="panel-content" style="background:var(--color-bg-canvas);">
                    <div class="preview-container">
                        <canvas id="previewCanvas"></canvas>
                    </div>
                    <p style="font-size:0.8rem; color:var(--color-text-tertiary); text-align:center; margin-top:8px;">
                        Zoom: Auto-fit (Pixelated)
                    </p>
                </div>
            </div>

            <!-- OUTPUT PANEL -->
            <div class="panel">
                <div class="panel-header">
                    C Generator
                    <span id="memorySize" class="metadata-tag">0 Bytes</span>
                </div>
                <div class="panel-content">
                    <div class="control-group">
                        <label class="control-label">Variable Name</label>
                        <input type="text" id="varName" value="image_data" class="input-field">
                    </div>

                    <textarea id="codeOutput" class="code-output" readonly
                        spellcheck="false">// Select an image to generate code...</textarea>

                    <div style="display:flex; gap:8px; margin-top:auto;">
                        <button class="btn btn-primary" style="flex:1;" onclick="copyCode()">Copy Array</button>
                        <!-- <button class="btn btn-secondary" onclick="downloadHeader()">.h</button> -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-row">
                    <span>&copy; 2026 <span
                            style="font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.1em; color: var(--color-signal-high);">EMBEDDED
                            UNFILTERED</span> • ALL RIGHTS RESERVED</span>
                </div>
                <div class="footer-row">
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                        REVISION 1.0.0
                    </span>
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        LAST UPDATED: JAN 2026
                    </span>
                </div>
            </div>
        </div>
    </footer>
    <script src="../js/image-to-c.js"></script>
</body>

</html>
