<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Payload Builder for IoT | Embedded Unfiltered</title>
    <meta name="description"
        content="Build and minify JSON payloads for IoT devices. Visualize payload size impact on bandwidth for protocols like MQTT or HTTP.">
    <link rel="stylesheet" href="../css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="keywords"
        content="json minifier, IoT payload builder, MQTT json, efficient json, telemetry data, embedded json">
    <meta property="og:title" content="JSON Payload Builder | Embedded Unfiltered">
    <meta property="og:description"
        content="Build and minify JSON payloads for IoT devices. Visualize payload size impact on bandwidth for protocols like MQTT or HTTP.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://embedded-unfiltered.github.io/tools/json-builder.html">
    <link rel="canonical" href="https://embedded-unfiltered.github.io/tools/json-builder.html">
    <style>
        .split-view {
            display: flex;
            gap: 20px;
        }

        .split-view>div {
            flex: 1;
        }

        textarea {
            font-family: var(--font-mono);
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand-glitch">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="white" stroke="none" />
                <path d="M10 9L7 12L10 15M14 9L17 12L14 15" stroke="black" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            Embedded Unfiltered
        </h1>
        <a href="../index.html" class="back-link">Back to Home</a>
    </header>

    <main>
        <div class="tool-content">
            <h1>JSON Payload Builder</h1>
            <p class="tool-desc">
                Edit JSON and see its minimized byte size in real-time. Optimize payloads for low-bandwidth IoT
                networks.
            </p>

            <div class="panel">
                <div class="split-view">
                    <div>
                        <label>JSON Editor</label>
                        <textarea id="jsonInput" rows="15">{
    "sensor": "temp",
    "val": 25.5,
    "ts": 1678900
}</textarea>
                        <button id="formatBtn" style="margin-top:10px; padding:5px 10px;">Format / Prettify</button>
                        <button id="minifyBtn" style="margin-top:10px; padding:5px 10px;">Minify to Input</button>
                    </div>
                    <div>
                        <label>Preview (Minified / On-Wire)</label>
                        <textarea id="jsonPreview" rows="15" readonly
                            style="background: var(--color-bg); opacity: 0.8;"></textarea>

                        <div class="result-box" style="margin-top:10px;">
                            <div class="result-item">
                                <span class="result-label">Payload Size:</span>
                                <span id="byteSize" class="result-value">0 bytes</span>
                            </div>
                            <div class="result-item">
                                <span class="result-label">Char Count:</span>
                                <span id="charCount" class="result-value">0 chars</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-row">
                    <span>&copy; 2026 <span
                            style="font-family: 'Oxanium', sans-serif; font-weight: 600; letter-spacing: 0.1em; color: var(--color-signal-high);">EMBEDDED
                            UNFILTERED</span> • ALL RIGHTS RESERVED</span>
                </div>
                <div class="footer-row">
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                        REVISION 1.0.0
                    </span>
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        LAST UPDATED: JAN 2026
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/json-builder.js"></script>
</body>

</html>
