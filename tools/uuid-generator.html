<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator | Embedded Unfiltered</title>
    <meta name="description"
        content="Generate RFC-compliant UUID v4 and v7 for embedded systems. Output as C byte arrays, struct initializers, or strings.">
    <link rel="stylesheet" href="../css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="keywords" content="uuid generator, uuid v4, uuid v7, c uuid struct, embedded unique id, rfc-4122">
    <meta property="og:title" content="UUID Generator | Embedded Unfiltered">
    <meta property="og:description"
        content="Generate RFC-compliant UUID v4 and v7 for embedded systems. Output as C byte arrays, struct initializers, or strings.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://embedded-unfiltered.github.io/tools/uuid-generator.html">
    <link rel="canonical" href="https://embedded-unfiltered.github.io/tools/uuid-generator.html">
    <style>
        .tool-grid {
            display: grid;
            grid-template-columns: 320px 560px 1fr;
            gap: var(--space-md);
            height: calc(100vh - 180px);
            min-height: 600px;
        }

        .panel {
            background: var(--color-bg-panel);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--color-border-subtle);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .control-label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 4px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Preview Area */
        .uuid-display-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .uuid-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border-subtle);
            border-radius: 6px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            position: relative;
        }

        .uuid-string {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--color-accent);
            word-break: break-all;
        }

        .uuid-meta {
            font-size: 0.8rem;
            color: var(--color-text-dim);
            display: flex;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .uuid-part {
            display: inline-block;
        }

        .part-time {
            color: #4facfe;
            border-bottom: 1px dashed #4facfe;
        }

        .part-ver {
            color: #ff9a9e;
            font-weight: bold;
        }

        .part-var {
            color: #f6d365;
            font-weight: bold;
        }

        .part-rand {
            color: var(--color-text-secondary);
        }

        /* Code Output */
        textarea.code-output {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--color-text-primary);
            resize: none;
            white-space: pre;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .uuid-card {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand-glitch">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="white" stroke="none" />
                <path d="M10 9L7 12L10 15M14 9L17 12L14 15" stroke="black" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            Embedded Unfiltered
        </h1>
        <a href="../index.html" class="back-link">Back to Home</a>
    </header>

    <main class="tool-content" style="max-width: 1400px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            <h1>UUID Generator</h1>
        </div>
        <div class="tool-grid">
            <!-- Left: Config -->
            <aside class="panel">
                <div class="panel-header">
                    Configuration
                </div>
                <div class="panel-content">
                    <div class="control-group">
                        <label class="control-label">UUID Version</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="uuidVer" value="v4" checked>
                                <span>Version 4 (Random)</span>
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="uuidVer" value="v7">
                                <span>Version 7 (Time-based)</span>
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Quantity</label>
                        <input type="number" id="genCount" class="input-field" value="1" min="1" max="100"
                            style="background:rgba(0,0,0,0.2); border:1px solid var(--color-border-subtle); border-radius:4px; padding:8px; color:white;">
                        <span style="font-size: 0.75rem; color: rgba(255, 255, 255, 0.3);">Max 100 allowed</span>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Output Format</label>
                        <div class="checkbox-group">
                            <label class="radio-item">
                                <input type="checkbox" id="fmtString" checked> UUID String
                            </label>
                            <label class="radio-item">
                                <input type="checkbox" id="fmtCArray" checked> C Byte Array
                            </label>
                            <label class="radio-item">
                                <input type="checkbox" id="fmtStruct"> C Struct Init
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Byte Order (C Output)</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="byteOrder" value="big" checked>
                                <span>Big Endian (Standard)</span>
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="byteOrder" value="little">
                                <span>Little Endian</span>
                            </label>
                        </div>
                    </div>

                    <div style="margin-top:auto;">
                        <button id="genBtn" class="btn btn-primary" style="width:100%;">Generate UUIDs</button>
                    </div>
                </div>
            </aside>

            <!-- Center: Preview -->
            <section class="panel">
                <div class="panel-header">
                    <span>Preview</span>
                    <div style="display:flex; gap:12px; align-items:center;">
                        <span id="previewCount" style="font-size:0.8rem; color:var(--color-text-dim);">0
                            Generated</span>
                        <button class="btn btn-sm" id="copyPreviewBtn">Copy List</button>
                    </div>
                </div>
                <div class="panel-content" id="previewContainer">
                    <!-- UUID Cards go here -->
                    <div style="text-align:center; color:var(--color-text-dim); margin-top:40px;">
                        Click Generate to start
                    </div>
                </div>
            </section>

            <!-- Right: Code -->
            <aside class="panel">
                <div class="panel-header">
                    <span>Code Output</span>
                    <button class="btn btn-sm" onclick="copyCode()">Copy</button>
                </div>
                <div class="panel-content" style="padding:0;">
                    <textarea id="codeOutput" class="code-output" readonly></textarea>
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-row">
                    <span>&copy; 2026 <span
                            style="font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.1em; color: var(--color-signal-high);">EMBEDDED
                            UNFILTERED</span> • ALL RIGHTS RESERVED</span>
                </div>
                <div class="footer-row">
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                        REVISION 1.0.0
                    </span>
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        LAST UPDATED: JAN 2026
                    </span>
                </div>
            </div>
            <div class="footer-right">
                <a href="https://www.linkedin.com/in/pradeep-kumar-ap/" target="_blank" class="footer-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path
                            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 22.227.792 23 1.771 23h20.451C23.2 23 24 22.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                    </svg>
                    Connect on LinkedIn
                </a>
            </div>
        </div>
    </footer>

    <script src="../js/uuid-generator.js"></script>
</body>

</html>
