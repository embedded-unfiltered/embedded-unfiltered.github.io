<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encoding Converter for Embedded Systems | Embedded Unfiltered</title>
    <meta name="description"
        content="Convert text between ASCII, Hexadecimal, and Base64 formats. Essential for debugging IoT payloads, serial data, and communication protocols.">
    <link rel="stylesheet" href="../css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="keywords"
        content="hex to ascii, base64 converter, binary to hex, string encoding, IoT payload decoding">
    <meta property="og:title" content="Encoding Converter | Embedded Unfiltered">
    <meta property="og:description"
        content="Convert text between ASCII, Hexadecimal, and Base64 formats. Essential for debugging IoT payloads, serial data, and communication protocols.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://embedded-unfiltered.github.io/tools/encoding-converter.html">
    <link rel="canonical" href="https://embedded-unfiltered.github.io/tools/encoding-converter.html">
    <style>
        textarea {
            font-family: var(--font-mono);
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand-glitch">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="white" stroke="none" />
                <path d="M10 9L7 12L10 15M14 9L17 12L14 15" stroke="black" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            Embedded Unfiltered
        </h1>
        <a href="../index.html" class="back-link">Back to Home</a>
    </header>

    <main>
        <div class="tool-content">
            <h1>Encoding Converter</h1>
            <p class="tool-desc">
                Bidirectional Text \u2194 Hex \u2194 Base64 conversion. Quickly decode memory dumps or encode network
                payloads.
            </p>

            <div class="panel">
                <h2>Converters</h2>
                <div class="input-group">
                    <label>ASCII Text</label>
                    <textarea id="asciiInput" rows="3" placeholder="Hello World"></textarea>
                </div>

                <div class="input-group">
                    <label>Hex (Space separated)</label>
                    <textarea id="hexInput" rows="3" placeholder="48 65 6C 6C 6F 20 57 6F 72 6C 64"></textarea>
                </div>

                <div class="input-group">
                    <label>Base64</label>
                    <textarea id="base64Input" rows="3" placeholder="SGVsbG8gV29ybGQ="></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-row">
                    <span>&copy; 2026 <span
                            style="font-family: 'Oxanium', sans-serif; font-weight: 600; letter-spacing: 0.1em; color: var(--color-signal-high);">EMBEDDED
                            UNFILTERED</span> • ALL RIGHTS RESERVED</span>
                </div>
                <div class="footer-row">
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                        REVISION 1.0.0
                    </span>
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        LAST UPDATED: JAN 2026
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/encoding.js"></script>
</body>

</html>
