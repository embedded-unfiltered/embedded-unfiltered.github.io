<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font to C Array Converter | Embedded Unfiltered</title>
    <meta name="description"
        content="Convert TTF fonts to C bitmap arrays for embedded displays (Adafruit GFX, LVGL). Supports variable width and custom ranges.">
    <link rel="stylesheet" href="../css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="keywords" content="font converter, ttf to c array, embedded fonts, GFX font, bitmap font generation">
    <meta property="og:title" content="Font to C Array Converter | Embedded Unfiltered">
    <meta property="og:description"
        content="Convert TTF fonts to C bitmap arrays for embedded displays (Adafruit GFX, LVGL). Supports variable width and custom ranges.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://embedded-unfiltered.github.io/tools/font-to-c.html">
    <link rel="canonical" href="https://embedded-unfiltered.github.io/tools/font-to-c.html">
    <style>
        .converter-grid {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: var(--space-md);
            height: calc(100vh - 180px);
            min-height: 600px;
        }

        .panel {
            background: var(--color-bg-panel);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--color-border-subtle);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Input Controls */
        .drop-zone {
            border: 2px dashed var(--color-border-subtle);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--color-text-secondary);
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--color-accent);
            background: rgba(0, 255, 136, 0.05);
            color: var(--color-accent);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        .radio-group {
            display: flex;
            gap: 12px;
        }

        /* Preview Grid */
        .glyph-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            padding: 8px;
        }

        .glyph-item {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--color-border-subtle);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .glyph-item:hover {
            border-color: var(--color-accent);
        }

        .glyph-item canvas {
            max-width: 90%;
            max-height: 90%;
            image-rendering: pixelated;
        }

        .glyph-char {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 8px;
            color: var(--color-text-tertiary);
            font-family: monospace;
        }

        /* Output */
        .code-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px;
            resize: none;
            flex: 1;
            color: var(--color-text-primary);
            white-space: pre;
            overflow: auto;
        }

        /* Improved Grid Spacing */
        .glyph-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 12px;
            padding: 12px;
        }

        /* Absolute positioning context for alignment */
        /* Absolute positioning context for alignment */
        .glyph-item {
            box-sizing: border-box;
            width: 100%;
            /* Height is set dynamically by JS */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--color-border-subtle);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            /* Restore for neatnes, relying on JS to size box big enough */
            display: flex;
            justify-content: center;
        }

        .glyph-item:hover {
            border-color: var(--color-accent);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Metrics Overlay */
        .metric-overlay {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 9px;
            color: var(--color-text-tertiary);
            font-family: monospace;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 1px 3px;
            border-radius: 2px;
            display: none;
        }

        .show-metrics .metric-overlay {
            display: block;
        }

        .metadata-tag {
            font-size: 0.8rem;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--color-text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .baseline-indicator {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 50, 50, 0.4);
            pointer-events: none;
            z-index: 10;
        }

        .glyph-item.pixel-perfect canvas {
            max-width: none;
            max-height: none;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .converter-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                height: auto;
            }

            .panel:nth-child(3) {
                /* Output panel */
                grid-column: 1 / -1;
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .converter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="brand-glitch">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                fill="none">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="white" stroke="none" />
                <path d="M10 9L7 12L10 15M14 9L17 12L14 15" stroke="black" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            Embedded Unfiltered
        </h1>
        <a href="../index.html" class="back-link">Back to Home</a>
    </header>

    <main class="tool-content" style="max-width: 1600px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Font to C Array</h1>
        </div>

        <div class="converter-grid">
            <!-- INPUT PANEL -->
            <div class="panel">
                <div class="panel-header">Font Settings</div>
                <div class="panel-content">
                    <!-- File Upload -->
                    <div class="drop-zone" id="dropZone">
                        <p>Drop .ttf / .otf File</p>
                        <input type="file" id="fileInput" accept=".ttf,.otf,.woff" style="display:none">
                        <span id="fileName"
                            style="display:block; margin-top:8px; font-size:0.9rem; color:var(--color-accent);"></span>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Font Size (Pixels)</label>
                        <input type="number" id="fontSize" value="16" min="8" max="128" class="input-field">
                    </div>

                    <div class="control-group">
                        <label class="control-label">Character Range</label>
                        <select id="rangeSelect" class="input-field">
                            <option value="ASCII">ASCII (32 - 126)</option>
                            <option value="NUMBERS">Numbers (48 - 57)</option>
                            <option value="UPPERCASE">Uppercase (65 - 90)</option>
                            <!-- <option value="CUSTOM">Custom Range...</option> -->
                        </select>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Bits Per Pixel (BPP)</label>
                        <div class="radio-group">
                            <label class="checkbox-label"><input type="radio" name="bpp" value="1" checked> 1-bit
                                (Mono)</label>
                            <label class="checkbox-label" style="opacity:0.5; cursor:not-allowed;"><input type="radio"
                                    name="bpp" value="4" disabled> 4-bit (AA)</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Preview Options</label>
                        <div style="display:flex; gap:16px;">
                            <label class="checkbox-label" style="font-size:0.8rem;">
                                <input type="checkbox" id="showBaseline" checked> Show Baseline
                            </label>
                            <!-- <label class="checkbox-label" style="font-size:0.8rem;">
                                <input type="checkbox" id="pixelPerfect"> 1:1 Preview
                            </label> -->
                            <label class="checkbox-label" style="font-size:0.8rem;">
                                <input type="checkbox" id="showMetrics"> Show Metrics
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label class="control-label">Alpha Threshold (0-255)</label>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="range" id="fontThreshold" min="0" max="255" value="128" step="1"
                                style="flex:1;">
                            <span id="thresholdVal"
                                style="font-size:0.8rem; font-family:monospace; min-width:30px;">128</span>
                        </div>
                    </div>

                    <hr style="border-color:var(--color-border-subtle); width:100%;">

                    <button class="btn btn-primary" id="processBtn" style="width:100%;">Generate Font</button>
                    <p id="statusMsg"
                        style="text-align:center; font-size:0.85rem; color:var(--color-text-tertiary); margin-top:8px;">
                    </p>
                </div>
            </div>

            <!-- PREVIEW PANEL -->
            <div class="panel">
                <div class="panel-header">
                    Glyph Preview
                    <span id="glyphCount" class="metadata-tag">0 Glyphs</span>
                </div>
                <div class="panel-content" style="background:#1a1a1a;"> <!-- Darker bg for preview -->
                    <div id="previewGrid" class="glyph-grid">
                        <!-- Glyphs injected here -->
                    </div>
                </div>
            </div>

            <!-- OUTPUT PANEL -->
            <div class="panel">
                <div class="panel-header">
                    C Source
                    <span id="memorySize" class="metadata-tag">0 KB</span>
                </div>
                <div class="panel-content">
                    <div class="control-group">
                        <label class="control-label">Font Name (C Struct)</label>
                        <input type="text" id="fontName" value="my_font" class="input-field">
                    </div>

                    <textarea id="codeOutput" class="code-output" readonly
                        spellcheck="false">// Load a font and click Generate...</textarea>

                    <div style="display:flex; gap:8px; margin-top:auto;">
                        <button class="btn btn-primary" style="flex:1;" onclick="copyCode()">Copy Code</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-row">
                    <span>&copy; 2026 <span
                            style="font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.1em; color: var(--color-signal-high);">EMBEDDED
                            UNFILTERED</span> • ALL RIGHTS RESERVED</span>
                </div>
                <div class="footer-row">
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                        REVISION 1.0.0
                    </span>
                    <span class="footer-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                            <line x1="16" y1="2" x2="16" y2="6" />
                            <line x1="8" y1="2" x2="8" y2="6" />
                            <line x1="3" y1="10" x2="21" y2="10" />
                        </svg>
                        LAST UPDATED: JAN 2026
                    </span>
                </div>
            </div>
        </div>
    </footer>
    <script src="../js/font-to-c.js"></script>
</body>

</html>
